[build]
publish = "dist"
command = "npm run build"

# ---------------------------------------------------------------------------
# Redirects (docs/ANFORDERUNGEN.md, section 7)
# ---------------------------------------------------------------------------

# Main domain is www. Netlify also handles this via the primary-domain setting;
# the explicit rule keeps it working regardless of the dashboard configuration.
[[redirects]]
from = "https://malerbetrieb-kringelis.de/*"
to = "https://www.malerbetrieb-kringelis.de/:splat"
status = 301
force = true

# Old Joomla URLs: transitional, remove 6-12 months after go-live.
# Specific rules must come before the catch-all.
[[redirects]]
from = "/index.php/impressum"
to = "/impressum"
status = 301

[[redirects]]
from = "/index.php/datenschutzerklaerung"
to = "/datenschutz"
status = 301

[[redirects]]
from = "/index.php"
to = "/"
status = 301

[[redirects]]
from = "/index.php/*"
to = "/"
status = 301

# ---------------------------------------------------------------------------
# Security headers (docs/ANFORDERUNGEN.md, section 8)
# The Content-Security-Policy itself is generated by Astro as <meta> tag with
# script/style hashes (astro.config.mjs). Only directives that are not allowed
# in a <meta> tag are sent as header here.
# ---------------------------------------------------------------------------
[[headers]]
for = "/*"
[headers.values]
Strict-Transport-Security = "max-age=31536000; includeSubDomains"
Content-Security-Policy = "frame-ancestors 'none'"
X-Frame-Options = "DENY"
X-Content-Type-Options = "nosniff"
Referrer-Policy = "strict-origin-when-cross-origin"
Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()"
Cross-Origin-Opener-Policy = "same-origin"

# Fingerprinted build assets can be cached forever
[[headers]]
for = "/_astro/*"
[headers.values]
Cache-Control = "public, max-age=31536000, immutable"
